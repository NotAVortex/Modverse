<style>
:root{--bg:#16181c;--card:#26292f;--card2:#1d1f23;--raise:#34363c;--line:#3b3e45;--tx:#b0bac5;--hi:#ecf9fb;--green:#1bd96a;--gdim:#1d4d37;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;color:var(--hi);font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand img{height:34px;mix-blend-mode:lighten}
.sp{flex:1}
select.ctl,.ctl{background:var(--card);border:0;border-radius:12px;padding:9px 14px;color:var(--hi);font-weight:600}
.iconbtn{background:var(--card);border-radius:12px;padding:9px 14px;color:var(--hi);font-weight:600}
.iconbtn:hover{background:var(--raise)}
nav{margin:0 24px 12px;max-width:1232px;display:inline-flex;gap:4px;background:var(--card2);border:1px solid var(--card);border-radius:14px;padding:6px;flex-wrap:wrap}
nav button{padding:8px 16px;border-radius:10px;font-weight:700;color:var(--hi)}
nav button:hover{background:var(--card)}
nav button.on{background:var(--gdim);color:var(--green)}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:0 24px 40px;max-width:1280px;margin:0}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
aside details{background:var(--card2);border:1px solid var(--card);border-radius:16px;margin-bottom:14px;padding:6px 16px}

.glyph{display:block;aspect-ratio:230/220;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand{gap:16px}
.brand .glyph{height:96px;flex:none;transition:transform .7s cubic-bezier(.3,1.4,.4,1);animation:spin 1s cubic-bezier(.2,1.2,.3,1) backwards}
.brand:hover .glyph{transform:rotate(180deg) scale(1.08)}
.brand span:not(.glyph){font-size:42px}
header{padding-top:14px;padding-bottom:6px}
.ld{grid-column:1/-1;position:relative;display:grid;place-items:center;min-height:380px}
.ld .wv{position:relative;width:130px;aspect-ratio:230/220;animation:turn 3.6s cubic-bezier(.7,0,.3,1) infinite}
.ld .glyph{position:absolute;inset:0;background:conic-gradient(from var(--a),hsl(var(--hue) 100% 62%),hsl(calc(var(--hue) + 120) 100% 62%),hsl(calc(var(--hue) + 240) 100% 62%),hsl(var(--hue) 100% 62%))}
.ld .glyph:nth-child(1){clip-path:inset(0 50% 0 0);animation:ring 2.4s linear infinite,wvA 1.8s cubic-bezier(.6,0,.3,1) infinite}
.ld .glyph:nth-child(2){clip-path:inset(0 0 0 50%);animation:ring 2.4s linear infinite,wvB 1.8s cubic-bezier(.6,0,.3,1) infinite}
.ld::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;padding:3px;background:conic-gradient(from var(--a),transparent 0 62%,var(--acc));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 1.3s linear infinite}
.ld::after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(closest-side,hsl(var(--hue) 100% 60%/.18),transparent);animation:breathe 1.8s ease-in-out infinite}

<script>
const $=s=>document.querySelector(s);

 iris:ic('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'),

 vanilla:ic('<circle cx="12" cy="12" r="9"/>'),
 minecraft:ic('<path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/>'),
 datapack:ic('<path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>')};
const licon=n=>`<span class="li">${LI[n]||CUBE}</span>`;
const S={src:'modrinth',type:'mod',q:'',versions:[],loaders:[],cats:[],env:[],oss:false,sort:'relevance',per:20,page:1,moreLd:false,vq:''};
let T={gv:[],ld:[],ct:[]},cfCats=null,total=0,files=[],token=0;

/* ---------- built-in lists, used when the tag API is unreachable ---------- */
const FB_L=[['fabric','mod modpack'],['forge','mod modpack'],['neoforge','mod modpack'],['quilt','mod modpack'],['liteloader','mod'],['modloader','mod'],['rift','mod'],['babric','mod'],['bta-babric','mod'],['legacy-fabric','mod'],['ornithe','mod'],['nilloader','mod'],['java-agent','mod'],['iris','shader'],['optifine','shader'],['canvas','shader'],['vanilla','shader'],['minecraft','resourcepack'],['datapack','datapack']].map(([name,t])=>({name,supported_project_types:t.split(' ')}));

/* ---------- search ---------- */
async function mrSearch(per,off){

  if(S.oss)f.push(['open_source:true']);
  const j=await mr(`/search?query=${encodeURIComponent(S.q)}&facets=${encodeURIComponent(JSON.stringify(f))}&index=${S.sort}&limit=${per}&offset=${off}`);
  const ln=new Set(T.ld.map(l=>l.name));
  return{total:j.total_hits,items:j.hits.map(h=>{
    const c=h.client_side!=='unsupported',s=h.server_side!=='unsupported';
    const env=c&&s?'Client or server':c?'Client':'Server';
    return{src:'Modrinth',id:h.project_id,title:h.title,author:h.author,desc:h.description,icon:h.icon_url,dl:h.downloads,fol:h.follows,upd:h.date_modified,
      tags:[env,...h.display_categories.filter(x=>!ln.has(x)).map(cap),...h.categories.filter(x=>ln.has(x))]}})};
}
async function run(){
  const my=++token,per=S.per,off=(S.page-1)*per;
  $('#res').innerHTML=LD();$('#notes').innerHTML='';
  const jobs=[mrSearch(per,off)];
  const r=await Promise.allSettled(jobs);if(my!==token)return;
  const ok=r.filter(x=>x.status==='fulfilled').map(x=>x.value),bad=r.filter(x=>x.status==='rejected');
  $('#notes').innerHTML=bad.map(b=>`<div class="note${b.reason.message.startsWith('Add a')?'':' err'}">${esc(b.reason.message==='Failed to fetch'?'Could not reach the mod source. If you are viewing this inside Claude’s preview, download the file and open it in a normal browser tab. Otherwise check that no ad blocker or firewall blocks api.modrinth.com.':b.reason.message)}</div>`).join('');
  total=Math.max(0,...ok.map(x=>x.total));
  const a=ok[0]?.items||[],b=ok[1]?.items||[],items=[];
  for(let i=0;i<Math.max(a.length,b.length);i++){if(a[i])items.push(a[i]);if(b[i])items.push(b[i])}
  $('#res').innerHTML=items.map((m,i)=>card(m,i)).join('')||(bad.length?'':'<div class="note">No results. Try removing a filter or changing your search.</div>');
  window.items=items;pager(per);
}
function card(m,i){
  const tg=m.tags.slice(0,6).map(t=>{const k=t.toLowerCase(),L=LI[k];return `<span class="tag" style="${LCOL[k]?`color:${LCOL[k]}`:''}">${L?licon(k):''}${esc(L?lname(k):cap(t))}</span>`}).join('');
  return `<div class="item" style="--i:${i}"><img class="ico" src="${esc(m.icon||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
  <div class="body"><button class="ttl" data-act="open" data-i="${i}">${esc(m.title)}</button><span class="by">by ${esc(m.author)}</span>
  <div class="desc">${esc(m.desc)}</div><div class="tags">${tg}</div></div>
  <div class="right"><span><b>${fmt(m.dl)}</b> downloads</span><span><b>${fmt(m.fol||0)}</b> ${m.src==='Modrinth'?'follows':'likes'}</span><span>${ago(m.upd)}</span>
  <button class="dlb" data-act="open" data-i="${i}">Download</button></div></div>`;
}
function pager(per){
  const n=Math.max(1,Math.ceil(total/per)),p=S.page,set=new Set([1,n]);
  for(let i=p-2;i<=p+2;i++)set.add(i);
  const nums=[...set].filter(x=>x>=1&&x<=n).sort((a,b)=>a-b);
  let h=`<div class="pbar"><button data-act="page" data-v="${p-1}" ${p<2?'disabled':''} aria-label="Previous page">‹</button>`,last=0;
  nums.forEach(x=>{
    if(x-last>1){const mid=Math.round((last+x)/2);h+=`<button class="gap" data-act="page" data-v="${mid}" title="Jump to page ${mid}" aria-label="Jump to page ${mid}">…</button>`}
    h+=`<button data-act="page" data-v="${x}" class="${x===p?'on':''}" ${x===p?'aria-current="page"':''}>${x}</button>`;last=x});
  h+=`<button data-act="page" data-v="${p+1}" ${p>=n?'disabled':''} aria-label="Next page">›</button><span class="sep"></span><label class="goto">Go to<input class="gt" type="number" min="1" max="${n}" placeholder="${p}" aria-label="Go to page"></label></div>`;
  $('#pg').innerHTML=$('#pg2').innerHTML=h;
}

/* ---------- download dialog ---------- */
let cur=null,D={ver:'',ld:''},OPT={vers:[],lds:[]};
async function openMod(m){cur=m;$('#dlg').showModal();await loadFiles()}
async function loadFiles(){
  const m=cur;
  $('#dlg').innerHTML=`<button class="x" data-act="close" aria-label="Close">×</button><div class="dh"><div class="mh"><img src="${esc(m.icon||'')}" alt=""><div><h2>${esc(m.title)}</h2>by ${esc(m.author)} · ${m.src}</div></div><div id="pk"></div></div><div class="db"><div id="dfl">${LD('sm')}</div></div>`;
  try{
    files=(await mr(`/project/${m.id}/version`)).map(v=>{const f=v.files.find(x=>x.primary)||v.files[0];return f&&{name:v.name||v.version_number,gv:v.game_versions,ld:v.loaders,type:v.version_type,size:f.size,url:f.url,file:f.filename,date:v.date_published}}).filter(Boolean);
    const VT=Object.fromEntries(T.gv.map(x=>[x.version,x.version_type])),ix=new Map(T.gv.map((x,i)=>[x.version,i]));
    const rank=v=>(VT[v]&&VT[v]!=='release'?1e4:0)+(ix.get(v)??9999);
    let vers=[...new Set(files.flatMap(f=>f.gv))].sort((a,b)=>rank(a)-rank(b)),lds=[...new Set(files.flatMap(f=>f.ld))];
    if(S.versions.length){const r=vers.filter(v=>S.versions.includes(v));if(r.length)vers=r}
    if(S.loaders.length){const r=lds.filter(l=>S.loaders.includes(l));if(r.length)lds=r}
    OPT={vers,lds,VT};
    D={ver:vers.length===1?vers[0]:'',ld:lds.length===1?lds[0]:''};
    dRender();
  }catch(e){$('#dfl').className='note err';$('#dfl').textContent=e.message==='Failed to fetch'?'Could not load files. Check your connection and try again.':e.message}
}
function dRender(){
  const{vers,lds,VT}=OPT,nv=vers.length>1,nl=lds.length>1;
  const o=a=>a.map(v=>`<option value="${esc(v)}"${v===D.ver?' selected':''}>${esc(v)}</option>`).join('');
  const rel=vers.filter(v=>!VT[v]||VT[v]==='release'),oth=vers.filter(v=>VT[v]&&VT[v]!=='release');
  const fixed=[!nv&&D.ver?'Game version '+D.ver:'',!nl&&D.ld?'Loader '+lname(D.ld):''].filter(Boolean).join(' · ');
  $('#pk').innerHTML=`<div class="pick">${nv?`<label>Game version<select id="pv"><option value="">Choose a version</option>${o(rel)}${oth.length?`<optgroup label="Snapshots and pre-releases">${o(oth)}</optgroup>`:''}</select></label>`:''}${nl?`<label>Loader<select id="pl"><option value="">Choose a loader</option>${lds.map(l=>`<option value="${esc(l)}"${l===D.ld?' selected':''}>${esc(lname(l))}</option>`).join('')}</select></label>`:''}</div>${fixed?`<p class="fx">${esc(fixed)}</p>`:''}`;
  dList();
}
function dList(){
  const need=[!D.ver&&'game version',!D.ld&&'loader'].filter(Boolean).join(' and '),b=$('#dfl');
  b.className='';
  if(!files.length){b.className='note';b.textContent='This project has no downloadable files.';return}
  if(need){b.className='note';b.textContent='Choose a '+need+' to see downloads.';return}
  const L=files.map((f,i)=>[f,i]).filter(([f])=>f.gv.includes(D.ver)&&f.ld.includes(D.ld));
  b.innerHTML=L.map(([f,i],n)=>`<div class="vrow" style="--i:${Math.min(n,14)}"><div><b>${esc(f.name)}</b><small><span class="${{release:'rel',beta:'bet',alpha:'alp'}[f.type]||''}">${cap(f.type||'')}</span> · ${size(f.size)} · ${ago(f.date)}</small></div><button class="dlb" data-act="dl" data-i="${i}">Download</button></div>`).join('')||'<div class="note">No files for this version and loader. Try another combination.</div>';
}
function save(h,n){const a=document.createElement('a');a.href=h;a.download=n;a.rel='noopener';document.body.append(a);a.click();a.remove()}
async function dl(btn,f){
  btn.textContent='Downloading…';
  try{const r=await fetch(f.url);if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());save(u,f.file);setTimeout(()=>URL.revokeObjectURL(u),6e4)}
  catch(e){save(f.url,f.file)}
  btn.textContent='Download';
}

/* ---------- events ---------- */
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
function go(){S.page=1;badge();run()}
function badge(){const m={versions:S.versions.length,loaders:S.loaders.length,cats:S.cats.length,env:S.env.length,oss:S.oss?1:0};document.querySelectorAll('.bd').forEach(b=>{const n=m[b.dataset.k];b.textContent=n||'';b.hidden=!n})}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const v=b.dataset.v;
  switch(b.dataset.act){
    case'type':S.type=v;S.loaders=[];S.cats=[];cfCats=null;tabs();sideLoaders();sideCats();$('#q').placeholder='Search '+TYPES[v][0].toLowerCase()+'...';go();break;
    case'ver':tog(S.versions,v);sideVers();go();break;
    case'allv':vdOpen();break;case'ldmore':S.moreLd=!S.moreLd;sideLoaders();break;case'vchip':tog(S.versions,v);vdRender();sideVers();break;case'vclear':S.versions=[];vdRender();sideVers();break;case'vdone':shut($('#vdlg'));break;
    case'ld':tog(S.loaders,v);sideLoaders();go();break;
    case'cat':tog(S.cats,v);sideCats();go();break;
    case'env':tog(S.env,v);sideMisc();go();break;
    case'oss':S.oss=!S.oss;sideMisc();go();break;
    case'page':S.page=+v;run();scrollTo({top:0,behavior:'smooth'});break;
    case'open':openMod(window.items[+b.dataset.i]);break;
    case'close':shut($('#dlg'));break;
    case'dl':dl(b,files[+b.dataset.i]);break;
  }
});
let t;$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{S.q=e.target.value.trim();go()},350)});
$('#vq').addEventListener('input',e=>{S.vq=e.target.value.trim();sideVers()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('gt')){const v=parseInt(e.target.value,10),mx=+e.target.max;if(!v)return;S.page=Math.min(Math.max(1,v),mx);run();scrollTo({top:0,behavior:'smooth'})}});
$('#sort').onchange=e=>{S.sort=e.target.value;go()};
$('#per').onchange=e=>{S.per=+e.target.value;go()};
$('#vdlg').addEventListener('close',go);
document.addEventListener('click',e=>{if(!e.target.closest('aside details'))document.querySelectorAll('aside details[open]').forEach(d=>d.open=false)});
document.querySelectorAll('aside details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('aside details[open]').forEach(o=>{if(o!==d)o.open=false})}));
function shut(d){if(!d.open||d.classList.contains('out'))return;d.classList.add('out');setTimeout(()=>{d.classList.remove('out');d.close()},180)}
$('#dlg').addEventListener('change',e=>{if(e.target.id==='pv')D.ver=e.target.value;else if(e.target.id==='pl')D.ld=e.target.value;else return;dList()});
for(const d of document.querySelectorAll('dialog')){d.addEventListener('click',e=>{if(e.target===d)shut(d)});d.addEventListener('cancel',e=>{e.preventDefault();shut(d)})}

(async()=>{
  tabs();sideMisc();
  const r=await Promise.allSettled([mr('/tag/game_version'),mr('/tag/loader'),mr('/tag/category')]);
  T.gv=r[0].value||FB_V;T.ld=r[1].value||FB_L;T.ct=r[2].value||FB_C;
  T.ld.forEach(l=>{if(typeof l.icon==='string'&&/^<svg/i.test(l.icon.trim())&&!/<script|\son\w+=|javascript:/i.test(l.icon))LI[l.name]=l.icon});
  sideVers();sideLoaders();sideCats();badge();
  run();
})();
</script>
</body>
</html>
